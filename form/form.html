<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
    <style>
        #btm{
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Job Application Form</h1>
    <form >
        <fieldset>
        <legend>Job Applicatiion</legend>
        <label for="Name">Enter Name:-</label>
        <input type="text" id="Name" placeholder="enter name..">
        <br>
        <br>
         <label for="email">Enter Email:-</label>
        <input type="text" id="email" placeholder="exam@gmail.com">
        <br>
        <br>
        <label for="date1">Date Of Birth:-</label>
        <input type="date" id="date1" placeholder="exam@gmail.com">
        <br>
        <br>
         <label for="number">Mobile Number:-</label>
        <input type="text" id="number" placeholder="+91---------- ">
        <br>
        <br>
         <label for="Resume">Upload Resume:-</label>
        <input type="file" id="Resume" value="Choose file">
        <br>
        <br>
        <fieldset>
            <legend>Skills</legend>
            <label for="CHECK">HTML:-</label>
            <input type="checkbox" id="CHECK">
              
             <label for="CHECK1">Node js:-</label>
            <input type="checkbox" id="CHECK1">
            
             <label for="CHECK2">CSS:-</label>
            <input type="checkbox" id="CHECK2">
            
             <label for="CHECK3">Java Script:-</label>
            <input type="checkbox" id="CHECK3">
            
             <label for="CHECK4">Python:-</label>
            <input type="checkbox" id="CHECK4">
           
             <label for="CHECK5">C++:-</label>
            <input type="checkbox" id="CHECK5">
            
              
        </fieldset>
        <br>
        <br>
         <label for="CHECK6">Experience Share(in year):-</label>
            <input type="number" id="CHECK6" min="0" max="50">
            <br>
            <br>
            <label for="7">Highest Education :-</label>
            <select name="degree" id="7">
                <option value="">10th pass</option>
                <option value="">12th pass</option>
                <option value="">Graduate</option>
                <option value="">Under Graduate</option>
                <option value="">B.tech</option>
                <option value="">M.tach</option>
                <option value="">Politacnic</option>
                <option value="">Bca</option>
                <option value="">MBA</option>
                <option value="">other</option>
            </select>
            <br>
            <br>
            <fieldset>
                <legend>Availability</legend>
                <label for="8">Full Time</label>
                <input type="radio" name="radio" id="8">
                <br>
                <br>
                <label for="9">Part Time</label>
                <input type="radio" name="radio" id="9">
                <br>
                <br>
            </fieldset>
            <label for="10">Additional Comment:</label>
            <br>
               <textarea name="textarea1" aria-placeholder="fhsgdihyf" id="10" cols="30" rows="10"> </textarea>
                <br>
                <br>
                <input type="submit" value="submit"  id="btm">

    </fieldset>
    </form>
</body>
</html>
