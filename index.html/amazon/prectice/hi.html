<!DOCTYPE html>
<html>
<head>
  <title>My E-Commerce Website</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; }
    header { background: #222; color: white; padding: 15px; text-align: center; }
    .products { display: flex; gap: 20px; padding: 20px; }
    .card { border: 1px solid #ddd; padding: 15px; width: 200px; text-align: center; }
    .card img { width: 100%; height: 150px; object-fit: cover; }
    .btn { background: #28a745; color: white; padding: 8px; text-decoration: none; display: inline-block; margin-top: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <header>
    <h1>My Shop</h1>
  </header>

  <section class="products">
    <div class="card">
      <img src="https://via.placeholder.com/150" alt="Product 1">
      <h3>Product 1</h3>
      <p>₹500</p>
      <a href="#" class="btn">Add to Cart</a>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/150" alt="Product 2">
      <h3>Product 2</h3>
      <p>₹1200</p>
      <a href="#" class="btn">Add to Cart</a>
    </div>
  </section>
</body>
</html>
