<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.container{
    height: 100vh;
    width: 100vw;
    margin: 10px;
    padding: 10px;
    background-color: #241d1d6b;
    display: flex;
    
}
.box{
    
    height: 100px;
    width: 100px;
    border: 2px solid black;
    flex-direction:column;
    margin: 12px;
    padding: 12px;
}
    
#box1{
    
    background-color: rgb(180, 34, 58);
    
    
}
#box2{

   
    background-color: rgb(233, 214, 0);

}
#box3{
   
    background-color: rgb(16, 46, 218);

}
#box4{
    
    background-color: rgb(8, 248, 24);

}
#box5{
 
    background-color: rgb(241, 35, 35);

}
@media(min-width:640px){
    .container{
        flex-direction: row;
    }
}
@media(max-width:640px){
    .container{
        flex-direction: column;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
