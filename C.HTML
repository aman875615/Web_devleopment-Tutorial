<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;           /* optional: table height control */
        }
        th, td {
            border: 1px solid black;
            padding: 20px;         /* yahan padding se row ki height badhegi */
            text-align: center;
        }
        caption {
            font-weight: bold;
            margin-bottom: 10px;   /* caption ke niche thodi space */
        }
    </style>
</head>
<body>
    <h1>Table</h1>
    <table>
        <caption>Employee Information</caption>
        <tr>
            <th>name</th>
            <th>age</th>
            <th>city</th>
        </tr>
        <tr>
            <td>Jane Smith</td>
            <td>25</td>
            <td>Los Angeles</td>
        </tr>
        <tr>
            <td>Smith</td>
            <td>28</td>
            <td>Angeles</td>
        </tr>
    </table>
</body>
</html>
