<!DOCTYPE html>
<html>
<head>
    <title>i and b Tag Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 16px;
            color: #555;
        }

        i {
            color: blue;
        }

        b {
            color: red;
        }
    </style>
</head>
<body>

    <h1>
        Hello, I am <i>Aman</i>
    </h1>

    <p>
        I am learning <b>HTML</b> and <i>CSS</i> for web development.
    </p>

    <p>
        <b>Bold text</b> is important and <i>italic text</i> is for emphasis.
    </p>
     <h1>
        Hello I am <span>Aman</span>
    </h1>
    <!-- 👆 YAHAN span use hua hai -->

    <p>
        I am learning <span>HTML and CSS</span> for web development.
    </p>

</body>
</html>
